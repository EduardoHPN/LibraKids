<div class="practice-container">
  <div class="header">
    <h1>Prática do Alfabeto</h1>
    <p>Use sua câmera para treinar em tempo real.</p>
  </div>
  <mat-card class="camera-card">
    <div class="video-wrapper">
      <video #videoElement autoplay playsinline muted></video>
      <div class="prediction-overlay">
        <span>{{ predictedLetter }}</span>
      </div>
      <div class="loading-overlay" *ngIf="isCameraLoading">
        <mat-progress-spinner mode="indeterminate" diameter="60"></mat-progress-spinner>
      </div>
    </div>
    <mat-card-content class="status-message">
      <p>{{ statusMessage }}</p>
    </mat-card-content>
  </mat-card>
  <div class="footer-actions">
    <button mat-stroked-button routerLink="/app/trilha">
      <mat-icon>arrow_back</mat-icon>
      <span>Voltar para a Trilha</span>
    </button>
  </div>
</div>
